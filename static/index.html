<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ReadyCo Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@telegram-apps/sdk@2.0.0/dist/index.iife.js"></script>
<style>
  :root {
    --yellow: #FFD400;
    --navy: #081220;
    --navy-light: #0f1a30;
    --navy-lighter: #15233f;
    --green: #00CB53;
    --orange: #FF8A00;
    --purple: #7A3CFF;
    --gray: #6b7a99;
    --gray-dark: #4a5a7a;
    --border: #1a2540;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Poppins', sans-serif; background: var(--navy); color: #fff; font-size: 14px; }
  
  #app { max-width: 600px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; position: relative; }
  
  /* Header */
  .header { padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); background: var(--navy); border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; align-items: center; gap: 10px; }
  .header .logo { width: 32px; height: 32px; background: var(--yellow); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--navy); font-size: 14px; }
  .header h1 { font-size: 17px; font-weight: 700; }
  .header .sub { font-size: 11px; color: var(--gray); margin-top: 1px; }
  
  /* Tabs */
  .tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--navy); }
  .tab { flex: 1; padding: 10px 2px; text-align: center; font-size: 12px; font-weight: 600; color: var(--gray); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
  .tab.active { color: var(--yellow); border-bottom-color: var(--yellow); }
  
  /* Search */
  .search-bar { padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .search-input { width: 100%; background: var(--navy-light); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; color: #fff; font-size: 13px; outline: none; font-family: 'Poppins', sans-serif; }
  .search-input:focus { border-color: var(--yellow); }
  
  /* Content scroll area */
  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  
  /* List items */
  .list-item { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; cursor: pointer; transition: background .1s; }
  .list-item:active { background: var(--navy-light); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--yellow); color: var(--navy); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; }
  .avatar.green { background: var(--green); }
  .avatar.orange { background: var(--orange); }
  .avatar.purple { background: var(--purple); }
  .item-info { flex: 1; min-width: 0; }
  .item-title { font-size: 14px; font-weight: 600; }
  .item-sub { font-size: 12px; color: var(--gray); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { font-size: 10px; color: var(--gray-dark); margin-top: 1px; }
  .badge { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 5px; margin-left: 4px; }
  .badge.new { background: var(--orange); color: var(--navy); }
  .badge.live { background: var(--green); color: var(--navy); }
  .badge.sold { background: var(--orange); color: var(--navy); }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); flex-shrink: 0; }
  
  /* Offer cards */
  .offer-card { background: var(--navy-light); margin: 8px 12px; border-radius: 14px; padding: 14px; border: 1px solid var(--border); }
  .offer-ref { font-size: 11px; color: var(--yellow); font-weight: 700; letter-spacing: .5px; }
  .offer-title { font-size: 15px; font-weight: 600; margin-top: 3px; }
  .offer-price { font-size: 13px; color: var(--green); margin-top: 3px; font-weight: 600; }
  .offer-actions { display: flex; gap: 6px; margin-top: 10px; }
  .btn-sm { padding: 6px 12px; border-radius: 8px; border: none; font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'Poppins', sans-serif; }
  .btn-sm.edit { background: var(--navy-lighter); color: var(--yellow); }
  .btn-sm.sold { background: var(--green); color: var(--navy); }
  .btn-sm.delete { background: var(--orange); color: var(--navy); }
  
  /* Stats */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
  .stat-card { background: var(--navy-light); border-radius: 14px; padding: 14px; text-align: center; }
  .stat-card .num { font-size: 28px; font-weight: 800; color: var(--yellow); }
  .stat-card .num.green { color: var(--green); }
  .stat-card .num.orange { color: var(--orange); }
  .stat-card .num.purple { color: var(--purple); }
  .stat-card .label { font-size: 11px; color: var(--gray); margin-top: 2px; }
  
  /* Chat */
  .chat-view { flex: 1; display: flex; flex-direction: column; height: 100%; }
  .chat-header { padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; background: var(--navy); }
  .chat-back { font-size: 20px; cursor: pointer; color: var(--yellow); line-height: 1; }
  .chat-profile-btn { width: 34px; height: 34px; border-radius: 8px; background: var(--navy-light); border: none; color: var(--yellow); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0; }
  .chat-profile-btn:active { background: var(--navy-lighter); }
  .chat-header-info { flex: 1; }
  .chat-header-name { font-size: 15px; font-weight: 600; }
  .chat-header-sub { font-size: 11px; color: var(--gray); }
  .chat-messages { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 16px; font-size: 13px; line-height: 1.4; word-wrap: break-word; }
  .msg.client { align-self: flex-start; background: var(--navy-lighter); border-bottom-left-radius: 4px; }
  .msg.admin { align-self: flex-end; background: var(--yellow); color: var(--navy); border-bottom-right-radius: 4px; font-weight: 500; }
  .msg .time { font-size: 9px; opacity: 0.5; margin-top: 3px; }
  .msg .sender { font-size: 10px; font-weight: 700; opacity: 0.6; margin-bottom: 1px; }
  .chat-input-bar { padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); display: flex; gap: 6px; align-items: center; flex-shrink: 0; background: var(--navy); }
  .chat-input { flex: 1; background: var(--navy-light); border: 1px solid var(--border); border-radius: 22px; padding: 10px 16px; color: #fff; font-size: 13px; resize: none; max-height: 80px; outline: none; font-family: 'Poppins', sans-serif; line-height: 1.3; }
  .chat-input:focus { border-color: var(--yellow); }
  .chat-send { width: 38px; height: 38px; border-radius: 50%; background: var(--yellow); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--navy); flex-shrink: 0; font-weight: 700; }
  .chat-send:active { transform: scale(0.92); }
  .chat-send.sending { opacity: 0.5; }
  .chat-attach { width: 34px; height: 34px; border-radius: 50%; background: var(--navy-light); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; flex-shrink: 0; color: var(--yellow); }
  
  /* Forms */
  .form { padding: 14px; padding-bottom: max(14px, env(safe-area-inset-bottom)); overflow-y: auto; }
  .form-group { margin-bottom: 12px; }
  .form-label { font-size: 12px; color: var(--gray); margin-bottom: 3px; font-weight: 500; }
  .form-input { width: 100%; background: var(--navy-light); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; color: #fff; font-size: 13px; outline: none; font-family: 'Poppins', sans-serif; }
  .form-input:focus { border-color: var(--yellow); }
  .form-submit { width: 100%; padding: 13px; background: var(--yellow); color: var(--navy); border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; font-family: 'Poppins', sans-serif; }
  .form-submit:active { transform: scale(0.98); }
  .form-cancel { width: 100%; padding: 10px; background: transparent; color: var(--gray); border: none; font-size: 13px; cursor: pointer; margin-top: 4px; font-family: 'Poppins', sans-serif; }
  .announce-area { width: 100%; min-height: 100px; background: var(--navy-light); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: #fff; font-size: 13px; outline: none; resize: vertical; font-family: 'Poppins', sans-serif; }
  .announce-area:focus { border-color: var(--yellow); }
  
  /* Empty / loading */
  .empty { text-align: center; padding: 50px 20px; color: var(--gray-dark); }
  .empty .icon { font-size: 40px; margin-bottom: 10px; }
  .empty p { font-size: 13px; margin-top: 4px; }
  
  /* FAB */
  .fab { position: absolute; bottom: 16px; right: 16px; width: 52px; height: 52px; border-radius: 50%; background: var(--yellow); color: var(--navy); border: none; font-size: 22px; cursor: pointer; z-index: 50; box-shadow: 0 4px 16px rgba(255,212,0,0.35); font-weight: 700; }
  .fab:active { transform: scale(0.92); }
  
  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--navy-light); border-radius: 16px; padding: 22px; max-width: 400px; width: 100%; }
  .modal h3 { font-size: 17px; margin-bottom: 6px; font-weight: 700; }
  .modal p { font-size: 13px; color: var(--gray); margin-bottom: 14px; }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btn { flex: 1; padding: 11px; border-radius: 10px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Poppins', sans-serif; }
  .modal-btn.confirm { background: var(--yellow); color: var(--navy); }
  .modal-btn.danger { background: var(--orange); color: var(--navy); }
  .modal-btn.cancel { background: var(--navy-lighter); color: var(--gray); }
  
  /* Manage items */
  .manage-item { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .manage-item:active { background: var(--navy-light); }
  .manage-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .manage-icon.yellow { background: rgba(255,212,0,0.15); }
  .manage-icon.green { background: rgba(0,203,83,0.15); }
  .manage-icon.purple { background: rgba(122,60,255,0.15); }
  .manage-icon.orange { background: rgba(255,138,0,0.15); }
</style>
</head>
<body>
<div id="app"></div>

<script>
const API = window.location.origin + '/api';
let tgUser = null;
if (window.telegram) {
  const tg = window.telegram.WebApp;
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#081220');
  tg.setBackgroundColor('#081220');
  tgUser = tg.initDataUnsafe?.user || null;
}

let view = 'leads';
let currentLeadId = null;
let leads = [];
let offers = [];
let editingOffer = null;

const FIELDS = [
  {key:'jurisdiction',label:'Jurisdiction',ph:'Poland'},
  {key:'company_type',label:'Company type',ph:'Sp. z o.o.'},
  {key:'year_established',label:'Year',ph:'2023'},
  {key:'license_type',label:'License type',ph:'VASP / CASP / EMI / PI / iGaming'},
  {key:'license_status',label:'License status',ph:'Active'},
  {key:'regulator',label:'Regulator',ph:'KNF'},
  {key:'bank_emi_account',label:'Bank / EMI',ph:'Yes / No'},
  {key:'vat_status',label:'VAT',ph:'Active / None'},
  {key:'turnover_history',label:'Turnover',ph:'Yes / No'},
  {key:'employees',label:'Employees',ph:'Yes / No / number'},
  {key:'transfer_time',label:'Transfer time',ph:'5-10 business days'},
  {key:'price',label:'Price',ph:'EUR 45,000'},
  {key:'short_description',label:'Description',ph:'Short description'},
];

async function api(path, opts={}) {
  const h = {'Content-Type':'application/json',...opts.headers};
  h['X-Telegram-Init-Data'] = tgUser ? tgUser.id.toString() : '8339164180';
  const r = await fetch(API+path, {...opts, headers:h});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function esc(t){const d=document.createElement('div');d.textContent=t||'';return d.innerHTML;}
function initials(name){return (name||'?')[0].toUpperCase();}

function render() {
  const app = document.getElementById('app');
  if (view==='chat') return renderChat(app);
  if (view==='add') return renderForm(app,'add');
  if (view==='edit') return renderForm(app,'edit');
  if (view==='announce') return renderAnnounce(app);
  renderMain(app);
}

function renderMain(app) {
  const tabs = [
    {k:'leads',l:'Leads',i:'👤'},
    {k:'offers',l:'Offers',i:'📋'},
    {k:'stats',l:'Stats',i:'📊'},
    {k:'manage',l:'Manage',i:'⚙️'},
  ];
  app.innerHTML = `
    <div class="header">
      <div class="logo">RC</div>
      <div><h1>ReadyCo Admin</h1><div class="sub">@readyco</div></div>
    </div>
    <div class="tabs">${tabs.map(t=>`<div class="tab ${view===t.k?'active':''}" onclick="switchView('${t.k}')">${t.i} ${t.l}</div>`).join('')}</div>
    ${view==='leads'?'<div class="search-bar"><input class="search-input" id="searchInput" placeholder="🔍 Search leads..." oninput="searchLeads(this.value)"></div>':''}
    <div class="content" id="content"></div>
    ${view==='offers'?'<button class="fab" onclick="switchView(\'add\')">+</button>':''}
  `;
  const c = document.getElementById('content');
  if (view==='leads') renderLeads(c);
  else if (view==='offers') renderOffers(c);
  else if (view==='stats') renderStats(c);
  else if (view==='manage') renderManage(c);
}

function renderLeads(c) {
  if (!leads.length) { c.innerHTML = '<div class="empty"><div class="icon">👤</div><p>No leads yet</p></div>'; return; }
  const colors = ['','green','orange','purple'];
  const tagColors = {hot:'var(--orange)',cold:'var(--gray)',closed:'var(--green)',warm:'var(--purple)'};
  c.innerHTML = leads.map((l,i) => {
    const name = l.telegram_username || `ID:${l.telegram_user_id}`;
    const colorClass = colors[i % colors.length];
    const isNew = l.status === 'new';
    const badge = isNew ? '<span class="badge new">NEW</span>' : '';
    const tag = l.tag ? `<span class="badge" style="background:${tagColors[l.tag]||'var(--navy-lighter)'};color:var(--navy)">${l.tag}</span>` : '';
    const unreadDot = isNew ? '<div class="unread-dot"></div>' : '';
    return `<div class="list-item" onclick="openLead(${l.id})">
      <div class="avatar ${colorClass}">${esc(initials(name))}</div>
      <div class="item-info">
        <div class="item-title">${esc(name)} ${badge} ${tag}</div>
        <div class="item-sub">${esc((l.last_msg||'').slice(0,45))}</div>
        <div class="item-meta">${l.msg_count||0} msgs</div>
      </div>${unreadDot}</div>`;
  }).join('');
}

function renderOffers(c) {
  if (!offers.length) { c.innerHTML = '<div class="empty"><div class="icon">📋</div><p>No offers yet. Tap +</p></div>'; return; }
  c.innerHTML = offers.map(o => `
    <div class="offer-card">
      <div class="offer-ref">${o.ref}</div>
      <div class="offer-title">${esc(o.jurisdiction)} ${esc(o.license_type||'')}</div>
      <div class="offer-price">${esc(o.price)}</div>
      <span class="badge ${o.status}">${o.status}</span>
      <div class="offer-actions">
        <button class="btn-sm edit" onclick="editOffer('${o.ref}')">Edit</button>
        ${o.status==='live'?`<button class="btn-sm sold" onclick="markSold('${o.ref}')">Sold</button>`:''}
        <button class="btn-sm delete" onclick="deleteOffer('${o.ref}')">Delete</button>
      </div>
    </div>`).join('');
}

function renderStats(c) {
  api('/admin/stats').then(d => {
    c.innerHTML = `<div class="stats-grid">
      <div class="stat-card"><div class="num">${d.live_offers}</div><div class="label">Live offers</div></div>
      <div class="stat-card"><div class="num green">${d.sold_offers}</div><div class="label">Sold</div></div>
      <div class="stat-card"><div class="num">${d.total_leads}</div><div class="label">Total leads</div></div>
      <div class="stat-card"><div class="num orange">${d.new_leads}</div><div class="label">New leads</div></div>
      <div class="stat-card"><div class="num green">${d.responded_leads}</div><div class="label">Responded</div></div>
      <div class="stat-card"><div class="num purple">${d.announcements}</div><div class="label">Announcements</div></div>
    </div>`;
  }).catch(e => { c.innerHTML = `<div class="empty"><p>${e.message}</p></div>`; });
}

function renderManage(c) {
  c.innerHTML = `
    <div class="manage-item" onclick="switchView('add')"><div class="manage-icon yellow">📝</div><div class="item-info"><div class="item-title">Add offer</div><div class="item-sub">Create new listing</div></div></div>
    <div class="manage-item" onclick="switchView('announce')"><div class="manage-icon orange">📢</div><div class="item-info"><div class="item-title">Announcement</div><div class="item-sub">Post to channel</div></div></div>
    <div class="manage-item" onclick="loadLeads();switchView('leads')"><div class="manage-icon green">👤</div><div class="item-info"><div class="item-title">Leads</div><div class="item-sub">Client inquiries</div></div></div>
    <div class="manage-item" onclick="window.open('https://t.me/readyco','_blank')"><div class="manage-icon purple">📺</div><div class="item-info"><div class="item-title">Channel</div><div class="item-sub">@readyco</div></div></div>
    <div class="manage-item" onclick="window.open('https://readyco.vercel.app','_blank')"><div class="manage-icon yellow">🌐</div><div class="item-info"><div class="item-title">Website</div><div class="item-sub">readyco.vercel.app</div></div></div>
    <div class="manage-item" onclick="exportLeads()"><div class="manage-icon green">📥</div><div class="item-info"><div class="item-title">Export leads</div><div class="item-sub">Download CSV</div></div></div>
  `;
}

function renderChat(app) {
  const lead = leads.find(l => l.id === currentLeadId);
  const name = lead?.telegram_username || `ID:${lead?.telegram_user_id}`;
  const profileLink = lead?.telegram_username ? `https://t.me/${lead.telegram_username}` : `tg://user?id=${lead?.telegram_user_id}`;
  app.innerHTML = `
    <div class="chat-view">
      <div class="chat-header">
        <div class="chat-back" onclick="backToMain()">‹</div>
        <div class="chat-header-info">
          <div class="chat-header-name">${esc(name)}</div>
          <div class="chat-header-sub">${lead?.offer_ref?('Offer: '+lead.offer_ref):'General inquiry'}</div>
        </div>
        <a href="${profileLink}" class="chat-profile-btn" target="_blank">👤</a>
        <button class="chat-profile-btn" onclick="showLeadActions(${lead?.id}, '${lead?.telegram_username || ''}', ${lead?.telegram_user_id || 0})">⋯</button>
      </div>
      <div class="chat-messages" id="chatMsgs"><div class="empty"><p>Loading...</p></div></div>
      <div class="chat-input-bar">
        <label class="chat-attach">
          <input type="file" id="fileInput" accept="image/*,application/pdf" style="display:none" onchange="sendFile(this)">
          📎
        </label>
        <textarea class="chat-input" id="replyInput" rows="1" placeholder="Type reply..."></textarea>
        <button class="chat-send" id="sendBtn" onclick="sendReply()">➤</button>
      </div>
    </div>`;
  loadMessages();
}

function renderForm(app, mode) {
  const o = mode==='edit' ? editingOffer : null;
  const title = mode==='edit' ? `Edit ${o.ref}` : 'Add offer';
  app.innerHTML = `
    <div class="chat-header">
      <div class="chat-back" onclick="${mode==='edit'?'switchView(\'offers\')':'backToMain()'}">‹</div>
      <div class="chat-header-info"><div class="chat-header-name">${title}</div></div>
    </div>
    <div class="form">
      ${FIELDS.map(f=>`<div class="form-group"><div class="form-label">${f.label}</div><input class="form-input" id="f_${f.key}" placeholder="${f.ph}" value="${o?esc(o[f.key]||''):''}"></div>`).join('')}
      <button class="form-submit" onclick="${mode==='edit'?'submitEdit()':'submitOffer()'}">${mode==='edit'?'Save':'Publish'}</button>
      <button class="form-cancel" onclick="${mode==='edit'?'switchView(\'offers\')':'backToMain()'}">Cancel</button>
    </div>`;
}

function renderAnnounce(app) {
  app.innerHTML = `
    <div class="chat-header">
      <div class="chat-back" onclick="backToMain()">‹</div>
      <div class="chat-header-info"><div class="chat-header-name">📢 Announcement</div></div>
    </div>
    <div class="form">
      <div class="form-group"><div class="form-label">Announcement text</div><textarea class="announce-area" id="annText" placeholder="New arrivals, special offers, updates..."></textarea></div>
      <button class="form-submit" onclick="submitAnnounce()">Publish to channel</button>
      <button class="form-cancel" onclick="backToMain()">Cancel</button>
    </div>`;
}

function switchView(v) { view = v; render(); }
function backToMain() { view = 'leads'; currentLeadId = null; editingOffer = null; loadLeads(); render(); }

async function openLead(id) { currentLeadId = id; view = 'chat'; render(); }
async function loadMessages() {
  const c = document.getElementById('chatMsgs');
  if (!c) return;
  c.innerHTML = '<div class="empty"><p>Loading...</p></div>';
  try {
    const d = await api(`/admin/leads/${currentLeadId}`);
    const msgs = d.messages || [];
    if (!msgs.length) { c.innerHTML = '<div class="empty"><div class="icon">💬</div><p>No messages</p></div>'; return; }
    
    // Load file URLs for photos and audio
    const fileMsgs = msgs.filter(m => m.file_id && (m.msg_type === 'photo' || m.msg_type === 'voice' || m.msg_type === 'audio'));
    await Promise.all(fileMsgs.map(async m => {
      try {
        const res = await api(`/admin/file/${encodeURIComponent(m.file_id)}`);
        if (m.msg_type === 'photo') m._img_url = res.url;
        else m._audio_url = res.url;
      } catch(e) {}
    }));
    
    // Render
    c.innerHTML = msgs.map(m => {
      const cl = m.direction === 'client_to_admin' ? 'client' : 'admin';
      const t = m.sent_at ? new Date(m.sent_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
      let content = esc(m.text);
      
      if (m.file_id && m.msg_type === 'photo' && m._img_url) {
        content = `<img src="${m._img_url}" style="width:100%;border-radius:12px;margin-bottom:6px;" onerror="this.style.display='none'">${content}`;
      } else if (m.file_id && (m.msg_type === 'voice' || m.msg_type === 'audio') && m._audio_url) {
        const dur = m.duration ? ` (${Math.floor(m.duration/60)}:${String(m.duration%60).padStart(2,'0')})` : '';
        content = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">🎤<audio controls style="height:32px;max-width:200px" src="${m._audio_url}"></audio>${dur}</div>${content}`;
      } else if (m.msg_type && m.msg_type !== 'text') {
        const icons = {photo:'📷',sticker:'🎨',document:'📎',voice:'🎤',video:'🎬',audio:'🎵',contact:'👤',location:'📍',animation:'🎞️'};
        const icon = icons[m.msg_type] || '💬';
        content = `${icon} ${content}`;
      }
      return `<div class="msg ${cl}">${cl==='admin'?'<div class="sender">ReadyCo</div>':''}${content}<div class="time">${t}</div></div>`;
    }).join('');
    c.scrollTop = c.scrollHeight;
  } catch(e) {
    c.innerHTML = `<div class="empty"><p>${e.message}</p></div>`;
  }
}

async function sendReply() {
  const input = document.getElementById('replyInput');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text || !currentLeadId) return;
  input.value = ''; input.style.height = 'auto';
  btn.classList.add('sending');
  try {
    await api('/admin/reply', {method:'POST', body:JSON.stringify({lead_id:currentLeadId, text})});
    btn.classList.remove('sending');
    await loadMessages(); loadLeads();
  } catch(e) { btn.classList.remove('sending'); alert('Failed: ' + e.message); }
}

async function sendFile(input) {
  const file = input.files[0];
  if (!file || !currentLeadId) return;
  input.value = '';
  const btn = document.getElementById('sendBtn');
  btn.classList.add('sending');
  try {
    // Upload via multipart
    const formData = new FormData();
    formData.append('file', file);
    formData.append('lead_id', currentLeadId);
    const h = {};
    h['X-Telegram-Init-Data'] = tgUser ? tgUser.id.toString() : '8339164180';
    const res = await fetch(API+'/admin/sendfile', {method:'POST', headers:h, body:formData});
    if (!res.ok) throw new Error(await res.text());
    btn.classList.remove('sending');
    await loadMessages(); loadLeads();
  } catch(e) { btn.classList.remove('sending'); alert('Failed to send file: ' + e.message); }
}

async function submitOffer() {
  const data = {};
  FIELDS.forEach(f => { const el = document.getElementById('f_'+f.key); if (el && el.value.trim()) data[f.key] = el.value.trim(); });
  if (!data.jurisdiction || !data.price) { alert('Jurisdiction and price required'); return; }
  try { await api('/admin/offers', {method:'POST', body:JSON.stringify(data)}); alert('Published!'); backToMain(); loadOffers(); }
  catch(e) { alert('Failed: ' + e.message); }
}

function editOffer(ref) { const o = offers.find(x=>x.ref===ref); if (o) { editingOffer = o; view='edit'; render(); } }
async function submitEdit() {
  const data = {};
  FIELDS.forEach(f => { const el = document.getElementById('f_'+f.key); if (el && el.value.trim()) data[f.key] = el.value.trim(); });
  try { await api(`/admin/offers/${editingOffer.ref}`, {method:'PUT', body:JSON.stringify(data)}); alert('Updated!'); view='offers'; loadOffers(); render(); }
  catch(e) { alert('Failed: ' + e.message); }
}

function markSold(ref) {
  showConfirm(`Mark ${ref} as SOLD?`, 'Channel post will be edited with strikethrough.', async () => {
    try { await api(`/admin/offers/${ref}/sold`, {method:'POST'}); alert('Sold!'); loadOffers(); }
    catch(e) { alert(e.message); }
  });
}

function deleteOffer(ref) {
  showConfirm(`Delete ${ref}?`, 'Permanently removes from channel and site.', async () => {
    try { await api(`/admin/offers/${ref}`, {method:'DELETE'}); alert('Deleted!'); loadOffers(); }
    catch(e) { alert(e.message); }
  });
}

async function submitAnnounce() {
  const text = document.getElementById('annText').value.trim();
  if (!text) return;
  try { await api('/admin/announce', {method:'POST', body:JSON.stringify({text})}); alert('Published!'); backToMain(); }
  catch(e) { alert(e.message); }
}

function showConfirm(title, body, onConfirm) {
  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.innerHTML = `<div class="modal"><h3>${title}</h3><p>${body}</p><div class="modal-btns"><button class="modal-btn cancel" onclick="this.closest('.modal-bg').remove()">Cancel</button><button class="modal-btn confirm" id="cfBtn">Confirm</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#cfBtn').onclick = () => { m.remove(); onConfirm(); };
}

function showLeadActions(leadId, username, userId) {
  const profileLink = username ? `https://t.me/${username}` : `tg://user?id=${userId}`;
  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.innerHTML = `<div class="modal">
    <h3>Lead actions</h3>
    <p>Manage this lead</p>
    <div class="modal-btns" style="flex-direction:column;gap:8px">
      <a href="${profileLink}" target="_blank" class="modal-btn confirm" style="text-decoration:none;text-align:center;display:block">👤 Open client profile</a>
      <div style="display:flex;gap:6px">
        <button class="modal-btn" style="background:var(--orange);color:var(--navy)" onclick="setTag(${leadId},'hot')">🔥 Hot</button>
        <button class="modal-btn" style="background:var(--purple);color:#fff" onclick="setTag(${leadId},'warm')">🔥 Warm</button>
      </div>
      <div style="display:flex;gap:6px">
        <button class="modal-btn" style="background:var(--gray);color:var(--navy)" onclick="setTag(${leadId},'cold')">❄️ Cold</button>
        <button class="modal-btn" style="background:var(--green);color:var(--navy)" onclick="setTag(${leadId},'closed')">✅ Closed</button>
      </div>
      <button class="modal-btn" style="background:var(--navy-lighter);color:var(--gray)" onclick="setTag(${leadId},null)">Remove tag</button>
      <button class="modal-btn danger" onclick="this.closest('.modal-bg').remove();blockLead(${leadId})">🚫 Block client</button>
      <button class="modal-btn danger" onclick="this.closest('.modal-bg').remove();deleteLead(${leadId})">🗑 Delete chat</button>
      <button class="modal-btn cancel" onclick="this.closest('.modal-bg').remove()">Cancel</button>
    </div>
  </div>`;
  document.body.appendChild(m);
}

async function setTag(leadId, tag) {
  document.querySelectorAll('.modal-bg').forEach(m => m.remove());
  try {
    await api(`/admin/leads/${leadId}/tag`, {method:'POST', body:JSON.stringify({tag})});
    loadLeads();
  } catch(e) { alert(e.message); }
}

let searchTimer = null;
function searchLeads(q) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    try {
      const d = await api(`/admin/leads${q?('?search='+encodeURIComponent(q)):''}`);
      leads = d.leads;
      if (view === 'leads') render();
    } catch(e) {}
  }, 300);
}

async function blockLead(leadId) {
  showConfirm('Block this client?', 'They will not be able to send messages to the bot anymore.', async () => {
    try { await api(`/admin/leads/${leadId}/block`, {method:'POST'}); alert('Client blocked'); backToMain(); }
    catch(e) { alert(e.message); }
  });
}

async function deleteLead(leadId) {
  showConfirm('Delete this chat?', 'All messages and lead data will be permanently removed.', async () => {
    try { await api(`/admin/leads/${leadId}`, {method:'DELETE'}); alert('Chat deleted'); backToMain(); }
    catch(e) { alert(e.message); }
  });
}

async function loadLeads() { try { const d = await api('/admin/leads'); leads = d.leads; if (view==='leads') render(); } catch(e){} }
async function loadOffers() { try { const d = await api('/admin/offers'); offers = d.offers; if (view==='offers') render(); } catch(e){} }

function exportLeads() {
  const h = {'Content-Type':'application/json','X-Telegram-Init-Data': tgUser ? tgUser.id.toString() : '8339164180'};
  fetch(API+'/admin/leads/export', {headers:h}).then(r => r.blob()).then(b => {
    const url = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = url; a.download = 'leads.csv'; a.click();
    URL.revokeObjectURL(url);
  }).catch(e => alert('Export failed: ' + e.message));
}

document.addEventListener('input', e => { if (e.target.id==='replyInput') { e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,80)+'px'; } });
document.addEventListener('keydown', e => { if (e.target.id==='replyInput' && e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); } });

loadLeads(); loadOffers(); render();
</script>
</body>
</html>
