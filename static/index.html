<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ReadyCo Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@telegram-apps/sdk@2.0.0/dist/index.iife.js"></script>
<style>
  :root {
    --yellow: #FFD400;
    --navy: #081220;
    --navy-2: #0d1729;
    --navy-3: #131e36;
    --border: #1c2944;
    --green: #00CB53;
    --orange: #FF8A00;
    --purple: #7A3CFF;
    --text: #fff;
    --text-2: #8499b8;
    --text-3: #5a6c87;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body { font-family:'Poppins', sans-serif; background:var(--navy); color:var(--text); font-size:14px; -webkit-font-smoothing:antialiased; }
  #app { max-width:600px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; position:relative; }
  
  /* Header — translucent, Apple-style */
  .header { padding:12px 16px; padding-top:max(12px,env(safe-area-inset-top)); background:rgba(8,18,32,0.85); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); border-bottom:1px solid var(--border); flex-shrink:0; display:flex; align-items:center; gap:10px; }
  .header-logo { width:28px; height:28px; background:var(--yellow); border-radius:7px; display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--navy); font-size:12px; flex-shrink:0; }
  .header-title { font-size:16px; font-weight:700; letter-spacing:-0.01em; }
  .header-sub { font-size:10px; color:var(--text-3); margin-top:1px; }
  
  /* Tabs */
  .tabs { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; background:rgba(8,18,32,0.85); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
  .tab { flex:1; padding:11px 2px; text-align:center; font-size:12px; font-weight:600; color:var(--text-3); cursor:pointer; border-bottom:2px solid transparent; transition:color .15s, border-color .15s; }
  .tab.active { color:var(--yellow); border-bottom-color:var(--yellow); }
  
  /* Search */
  .search-bar { padding:8px 12px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .search-input { width:100%; background:var(--navy-2); border:1px solid var(--border); border-radius:10px; padding:9px 14px; color:var(--text); font-size:13px; outline:none; font-family:'Poppins',sans-serif; }
  .search-input:focus { border-color:var(--text-3); }
  .search-input::placeholder { color:var(--text-3); }
  
  /* Content */
  .content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  
  /* List */
  .list-item { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; cursor:pointer; transition:background .1s; }
  .list-item:active { background:var(--navy-2); }
  .avatar { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex-shrink:0; color:var(--navy); }
  .avatar.a1 { background:var(--yellow); }
  .avatar.a2 { background:var(--green); }
  .avatar.a3 { background:var(--orange); }
  .avatar.a4 { background:var(--purple); }
  .item-info { flex:1; min-width:0; }
  .item-title { font-size:14px; font-weight:600; letter-spacing:-0.01em; display:flex; align-items:center; gap:6px; }
  .item-sub { font-size:12px; color:var(--text-2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item-meta { font-size:10px; color:var(--text-3); margin-top:2px; }
  .badge { font-size:9px; font-weight:700; padding:2px 7px; border-radius:5px; }
  .badge.new { background:var(--orange); color:var(--navy); }
  .badge.tag { color:var(--navy); }
  .unread-dot { width:8px; height:8px; border-radius:50%; background:var(--orange); flex-shrink:0; }
  
  /* Offer cards */
  .offer-card { background:var(--navy-2); margin:8px 12px; border-radius:14px; padding:16px; border:1px solid var(--border); }
  .offer-flag { font-size:24px; line-height:1; margin-bottom:10px; }
  .offer-juris { font-size:16px; font-weight:700; letter-spacing:-0.01em; }
  .offer-lic { font-size:13px; color:var(--green); margin-top:2px; font-weight:600; }
  .offer-price { font-size:20px; font-weight:800; letter-spacing:-0.02em; margin-top:12px; }
  .offer-status { font-size:10px; font-weight:700; padding:3px 8px; border-radius:5px; display:inline-block; margin-top:6px; }
  .offer-status.live { background:var(--green); color:var(--navy); }
  .offer-status.sold { background:var(--orange); color:var(--navy); }
  .offer-ref { font-size:10px; color:var(--text-3); font-weight:600; letter-spacing:1px; margin-top:8px; }
  .offer-actions { display:flex; gap:6px; margin-top:12px; }
  .btn-sm { padding:7px 14px; border-radius:8px; border:none; font-size:12px; font-weight:600; cursor:pointer; font-family:'Poppins',sans-serif; transition:opacity .1s; }
  .btn-sm:active { opacity:0.7; }
  .btn-sm.edit { background:var(--navy-3); color:var(--yellow); }
  .btn-sm.sold { background:var(--green); color:var(--navy); }
  .btn-sm.delete { background:var(--orange); color:var(--navy); }
  
  /* Stats */
  .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px; }
  .stat-card { background:var(--navy-2); border-radius:14px; padding:16px; text-align:center; border:1px solid var(--border); }
  .stat-num { font-size:28px; font-weight:800; letter-spacing:-0.02em; color:var(--yellow); }
  .stat-num.g { color:var(--green); }
  .stat-num.o { color:var(--orange); }
  .stat-num.p { color:var(--purple); }
  .stat-label { font-size:11px; color:var(--text-3); margin-top:2px; }
  
  /* Chat */
  .chat-view { flex:1; display:flex; flex-direction:column; height:100%; }
  .chat-header { padding:10px 14px; padding-top:max(10px,env(safe-area-inset-top)); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; flex-shrink:0; background:rgba(8,18,32,0.85); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
  .chat-back { font-size:20px; cursor:pointer; color:var(--yellow); line-height:1; width:32px; height:32px; display:flex; align-items:center; justify-content:center; }
  .chat-back:active { opacity:0.6; }
  .chat-header-info { flex:1; min-width:0; }
  .chat-header-name { font-size:15px; font-weight:600; letter-spacing:-0.01em; }
  .chat-header-sub { font-size:11px; color:var(--text-3); }
  .chat-btn { width:32px; height:32px; border-radius:8px; background:var(--navy-2); border:none; color:var(--yellow); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; text-decoration:none; flex-shrink:0; transition:background .1s; }
  .chat-btn:active { background:var(--navy-3); }
  
  .chat-messages { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:82%; padding:9px 13px; border-radius:16px; font-size:13px; line-height:1.4; word-wrap:break-word; }
  .msg.client { align-self:flex-start; background:var(--navy-3); border-bottom-left-radius:4px; }
  .msg.admin { align-self:flex-end; background:var(--yellow); color:var(--navy); border-bottom-right-radius:4px; font-weight:500; }
  .msg .time { font-size:9px; opacity:0.4; margin-top:3px; }
  .msg .sender { font-size:10px; font-weight:700; opacity:0.5; margin-bottom:1px; }
  
  .chat-input-bar { padding:8px 12px; padding-bottom:max(8px,env(safe-area-inset-bottom)); border-top:1px solid var(--border); display:flex; gap:6px; align-items:center; flex-shrink:0; background:rgba(8,18,32,0.85); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
  .chat-attach { width:34px; height:34px; border-radius:50%; background:var(--navy-2); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; flex-shrink:0; color:var(--yellow); }
  .chat-input { flex:1; background:var(--navy-2); border:1px solid var(--border); border-radius:22px; padding:10px 16px; color:var(--text); font-size:13px; resize:none; max-height:80px; outline:none; font-family:'Poppins',sans-serif; line-height:1.3; }
  .chat-input:focus { border-color:var(--text-3); }
  .chat-input::placeholder { color:var(--text-3); }
  .chat-send { width:38px; height:38px; border-radius:50%; background:var(--yellow); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--navy); flex-shrink:0; font-weight:700; transition:transform .1s; }
  .chat-send:active { transform:scale(0.92); }
  .chat-send.sending { opacity:0.5; }
  
  /* Forms */
  .form { padding:14px; padding-bottom:max(14px,env(safe-area-inset-bottom)); overflow-y:auto; }
  .form-group { margin-bottom:12px; }
  .form-label { font-size:12px; color:var(--text-2); margin-bottom:3px; font-weight:500; }
  .form-input { width:100%; background:var(--navy-2); border:1px solid var(--border); border-radius:12px; padding:11px 14px; color:var(--text); font-size:13px; outline:none; font-family:'Poppins',sans-serif; }
  .form-input:focus { border-color:var(--text-3); }
  .form-input::placeholder { color:var(--text-3); }
  .form-submit { width:100%; padding:13px; background:var(--yellow); color:var(--navy); border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; margin-top:6px; font-family:'Poppins',sans-serif; transition:transform .1s; }
  .form-submit:active { transform:scale(0.98); }
  .form-cancel { width:100%; padding:10px; background:transparent; color:var(--text-3); border:none; font-size:13px; cursor:pointer; margin-top:4px; font-family:'Poppins',sans-serif; }
  .announce-area { width:100%; min-height:100px; background:var(--navy-2); border:1px solid var(--border); border-radius:12px; padding:12px; color:var(--text); font-size:13px; outline:none; resize:vertical; font-family:'Poppins',sans-serif; }
  .announce-area:focus { border-color:var(--text-3); }
  
  /* Empty */
  .empty { text-align:center; padding:60px 20px; color:var(--text-3); }
  .empty .icon { font-size:36px; margin-bottom:10px; }
  .empty p { font-size:13px; }
  
  /* FAB */
  .fab { position:absolute; bottom:20px; right:20px; width:52px; height:52px; border-radius:50%; background:var(--yellow); color:var(--navy); border:none; font-size:22px; cursor:pointer; z-index:50; box-shadow:0 4px 16px rgba(255,212,0,0.35); font-weight:700; transition:transform .1s; }
  .fab:active { transform:scale(0.92); }
  
  /* Modal */
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal { background:var(--navy-2); border:1px solid var(--border); border-radius:16px; padding:22px; max-width:400px; width:100%; }
  .modal h3 { font-size:17px; font-weight:700; letter-spacing:-0.01em; }
  .modal p { font-size:13px; color:var(--text-2); margin:6px 0 14px; }
  .modal-btns { display:flex; flex-direction:column; gap:8px; }
  .modal-btn { padding:11px; border-radius:10px; border:none; font-size:13px; font-weight:600; cursor:pointer; font-family:'Poppins',sans-serif; text-align:center; text-decoration:none; transition:opacity .1s; }
  .modal-btn:active { opacity:0.8; }
  .modal-btn.confirm { background:var(--yellow); color:var(--navy); }
  .modal-btn.danger { background:var(--orange); color:var(--navy); }
  .modal-btn.cancel { background:var(--navy-3); color:var(--text-2); }
  
  /* Manage */
  .manage-item { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; cursor:pointer; transition:background .1s; }
  .manage-item:active { background:var(--navy-2); }
  .manage-icon { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .manage-icon.y { background:rgba(255,212,0,0.12); }
  .manage-icon.g { background:rgba(0,203,83,0.12); }
  .manage-icon.p { background:rgba(122,60,255,0.12); }
  .manage-icon.o { background:rgba(255,138,0,0.12); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = window.location.origin + '/api';
let tgUser = null;
if (window.telegram) { const tg = window.telegram.WebApp; tg.ready(); tg.expand(); tg.setHeaderColor('#081220'); tg.setBackgroundColor('#081220'); tgUser = tg.initDataUnsafe?.user || null; }

let view = 'leads';
let currentLeadId = null;
let leads = [];
let offers = [];
let editingOffer = null;

const FIELDS = [
  {key:'jurisdiction',label:'Jurisdiction',ph:'Poland'},
  {key:'company_type',label:'Company type',ph:'Sp. z o.o.'},
  {key:'year_established',label:'Year',ph:'2023'},
  {key:'license_type',label:'License type',ph:'VASP / CASP / EMI / PI / iGaming'},
  {key:'license_status',label:'License status',ph:'Active'},
  {key:'regulator',label:'Regulator',ph:'KNF'},
  {key:'bank_emi_account',label:'Bank / EMI',ph:'Yes / No'},
  {key:'vat_status',label:'VAT',ph:'Active / None'},
  {key:'turnover_history',label:'Turnover',ph:'Yes / No'},
  {key:'employees',label:'Employees',ph:'Yes / No / number'},
  {key:'transfer_time',label:'Transfer time',ph:'5-10 business days'},
  {key:'price',label:'Price',ph:'EUR 45,000'},
  {key:'short_description',label:'Description',ph:'Short description'},
];

async function api(path, opts={}) {
  const h = {'Content-Type':'application/json',...opts.headers};
  h['X-Telegram-Init-Data'] = tgUser ? tgUser.id.toString() : '8339164180';
  const r = await fetch(API+path, {...opts, headers:h});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
function esc(t){const d=document.createElement('div');d.textContent=t||'';return d.innerHTML}
function initials(n){return (n||'?')[0].toUpperCase()}

function render() {
  const app = document.getElementById('app');
  if (view==='chat') return renderChat(app);
  if (view==='add') return renderForm(app,'add');
  if (view==='edit') return renderForm(app,'edit');
  if (view==='announce') return renderAnnounce(app);
  renderMain(app);
}

function renderMain(app) {
  const tabs = [{k:'leads',l:'Leads',i:'👤'},{k:'offers',l:'Offers',i:'📋'},{k:'stats',l:'Stats',i:'📊'},{k:'manage',l:'Manage',i:'⚙️'}];
  app.innerHTML = `
    <div class="header">
      <div class="header-logo">RC</div>
      <div><div class="header-title">ReadyCo Admin</div><div class="header-sub">@readyco</div></div>
    </div>
    <div class="tabs">${tabs.map(t=>`<div class="tab ${view===t.k?'active':''}" onclick="switchView('${t.k}')">${t.i} ${t.l}</div>`).join('')}</div>
    ${view==='leads'?'<div class="search-bar"><input class="search-input" id="searchInput" placeholder="Search leads..." oninput="searchLeads(this.value)"></div>':''}
    <div class="content" id="content"></div>
    ${view==='offers'?"<button class=\"fab\" onclick=\"switchView('add')\">+</button>":''}
  `;
  const c = document.getElementById('content');
  if (view==='leads') renderLeads(c);
  else if (view==='offers') renderOffers(c);
  else if (view==='stats') renderStats(c);
  else if (view==='manage') renderManage(c);
}

function renderLeads(c) {
  if (!leads.length) { c.innerHTML = '<div class="empty"><div class="icon">👤</div><p>No leads yet</p></div>'; return; }
  const tagColors = {hot:'var(--orange)',warm:'var(--purple)',cold:'var(--text-3)',closed:'var(--green)'};
  c.innerHTML = leads.map((l,i) => {
    const name = l.telegram_username || `ID:${l.telegram_user_id}`;
    const isNew = l.status === 'new';
    const badge = isNew ? '<span class="badge new">NEW</span>' : '';
    const tag = l.tag ? `<span class="badge tag" style="background:${tagColors[l.tag]||'var(--navy-3)'}">${l.tag}</span>` : '';
    const dot = isNew ? '<div class="unread-dot"></div>' : '';
    const offerBadge = l.offer_ref ? `<span style="color:var(--green);font-size:10px;font-weight:600">📋 ${l.offer_ref}</span>` : '';
    const offerCount = l.offer_refs && l.offer_refs.split(',').length > 1 ? ` <span style="color:var(--purple);font-size:10px">+${l.offer_refs.split(',').length-1}</span>` : '';
    return `<div class="list-item" onclick="openLead(${l.id})">
      <div class="avatar a${(i%4)+1}">${esc(initials(name))}</div>
      <div class="item-info">
        <div class="item-title">${esc(name)} ${badge} ${tag}</div>
        <div class="item-sub">${esc((l.last_msg||'').slice(0,45))}</div>
        <div class="item-meta">${l.msg_count||0} msgs ${offerBadge?'· '+offerBadge+offerCount:''}</div>
      </div>${dot}</div>`;
  }).join('');
}

function renderOffers(c) {
  if (!offers.length) { c.innerHTML = '<div class="empty"><div class="icon">📋</div><p>No offers. Tap +</p></div>'; return; }
  const FLAGS={poland:'🇵🇱',lithuania:'🇱🇹',cyprus:'🇨🇾',curacao:'🇨🇼',uae:'🇦🇪',uk:'🇬🇧',usa:'🇺🇸',germany:'🇩🇪',estonia:'🇪🇪',latvia:'🇱🇻',malta:'🇲🇹',ireland:'🇮🇪',netherlands:'🇳🇱',switzerland:'🇨🇭',singapore:'🇸🇬'};
  function flag(j){if(!j)return'🌍';j=j.toLowerCase();for(const[k,v]of Object.entries(FLAGS)){if(j.includes(k))return v}return'🌍'}
  c.innerHTML = offers.map(o => `
    <div class="offer-card">
      <div class="offer-flag">${flag(o.jurisdiction)}</div>
      <div class="offer-juris">${esc(o.jurisdiction)} ${esc(o.license_type||'')}</div>
      <div class="offer-price">${esc(o.price)}</div>
      <span class="offer-status ${o.status}">${o.status}</span>
      <div class="offer-ref">${o.ref}</div>
      <div class="offer-actions">
        <button class="btn-sm edit" onclick="editOffer('${o.ref}')">Edit</button>
        ${o.status==='live'?`<button class="btn-sm sold" onclick="markSold('${o.ref}')">Sold</button>`:''}
        <button class="btn-sm delete" onclick="deleteOffer('${o.ref}')">Delete</button>
      </div>
    </div>`).join('');
}

function renderStats(c) {
  api('/admin/stats').then(d => {
    c.innerHTML = `<div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${d.live_offers}</div><div class="stat-label">Live offers</div></div>
      <div class="stat-card"><div class="stat-num g">${d.sold_offers}</div><div class="stat-label">Sold</div></div>
      <div class="stat-card"><div class="stat-num">${d.total_leads}</div><div class="stat-label">Total leads</div></div>
      <div class="stat-card"><div class="stat-num o">${d.new_leads}</div><div class="stat-label">New</div></div>
      <div class="stat-card"><div class="stat-num g">${d.responded_leads}</div><div class="stat-label">Responded</div></div>
      <div class="stat-card"><div class="stat-num p">${d.announcements}</div><div class="stat-label">Announcements</div></div>
    </div>`;
  }).catch(e => { c.innerHTML = `<div class="empty"><p>${e.message}</p></div>`; });
}

function renderManage(c) {
  c.innerHTML = `
    <div class="manage-item" onclick="switchView('add')"><div class="manage-icon y">📝</div><div class="item-info"><div class="item-title">Add offer</div><div class="item-sub">Create listing</div></div></div>
    <div class="manage-item" onclick="switchView('announce')"><div class="manage-icon o">📢</div><div class="item-info"><div class="item-title">Announcement</div><div class="item-sub">Post to channel</div></div></div>
    <div class="manage-item" onclick="loadLeads();switchView('leads')"><div class="manage-icon g">👤</div><div class="item-info"><div class="item-title">Leads</div><div class="item-sub">Client inquiries</div></div></div>
    <div class="manage-item" onclick="window.open('https://t.me/readyco','_blank')"><div class="manage-icon p">📺</div><div class="item-info"><div class="item-title">Channel</div><div class="item-sub">@readyco</div></div></div>
    <div class="manage-item" onclick="window.open('https://readyco.vercel.app','_blank')"><div class="manage-icon y">🌐</div><div class="item-info"><div class="item-title">Website</div><div class="item-sub">readyco.vercel.app</div></div></div>
    <div class="manage-item" onclick="exportLeads()"><div class="manage-icon g">📥</div><div class="item-info"><div class="item-title">Export leads</div><div class="item-sub">CSV</div></div></div>
    <div class="manage-item" onclick="doBackup()"><div class="manage-icon y">💾</div><div class="item-info"><div class="item-title">Backup</div><div class="item-sub">JSON to Telegram</div></div></div>
    <div class="manage-item" onclick="document.getElementById('restoreFile').click()"><div class="manage-icon o">♻️</div><div class="item-info"><div class="item-title">Restore</div><div class="item-sub">From JSON file</div></div></div>
    <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="doRestore(this)">
  `;
}

function renderChat(app) {
  const lead = leads.find(l => l.id === currentLeadId);
  const name = lead?.telegram_username || `ID:${lead?.telegram_user_id}`;
  const profileLink = lead?.telegram_username ? `https://t.me/${lead.telegram_username}` : `tg://user?id=${lead?.telegram_user_id}`;
  app.innerHTML = `
    <div class="chat-view">
      <div class="chat-header">
        <div class="chat-back" onclick="backToMain()">‹</div>
        <div class="chat-header-info">
          <div class="chat-header-name">${esc(name)}</div>
          <div class="chat-header-sub">${lead?.offer_refs && lead.offer_refs.split(',').length > 1 ? `📋 ${lead.offer_refs.split(',').join(' · ')}` : lead?.offer_ref ? `📋 ${lead.offer_ref}` : 'General inquiry'}</div>
        </div>
        <a href="${profileLink}" class="chat-btn" target="_blank">👤</a>
        <button class="chat-btn" id="leadActionsBtn">⋯</button>
      </div>
      <div class="chat-messages" id="chatMsgs"><div class="empty"><p>Loading...</p></div></div>
      <div class="chat-input-bar">
        <label class="chat-attach"><input type="file" id="fileInput" accept="image/*,application/pdf" style="display:none" onchange="sendFile(this)">📎</label>
        <textarea class="chat-input" id="replyInput" rows="1" placeholder="Reply..."></textarea>
        <button class="chat-send" id="sendBtn" onclick="sendReply()">➤</button>
      </div>
    </div>`;
  loadMessages();
  const actionsBtn = document.getElementById('leadActionsBtn');
  if (actionsBtn && lead) {
    actionsBtn.addEventListener('click', () => showLeadActions(lead.id, lead.telegram_username||'', lead.telegram_user_id||0));
  }
}

function renderForm(app, mode) {
  const o = mode==='edit' ? editingOffer : null;
  const title = mode==='edit' ? `Edit ${o.ref}` : 'New offer';
  const back = mode==='edit' ? `switchView('offers')` : `backToMain()`;
  app.innerHTML = `
    <div class="chat-header">
      <div class="chat-back" onclick="${back}">‹</div>
      <div class="chat-header-info"><div class="chat-header-name">${title}</div></div>
    </div>
    <div class="form">
      ${FIELDS.map(f=>`<div class="form-group"><div class="form-label">${f.label}</div><input class="form-input" id="f_${f.key}" placeholder="${f.ph}" value="${o?esc(o[f.key]||''):''}"></div>`).join('')}
      <button class="form-submit" onclick="${mode==='edit'?'submitEdit()':'submitOffer()'}">${mode==='edit'?'Save':'Publish'}</button>
      <button class="form-cancel" onclick="${back}">Cancel</button>
    </div>`;
}

function renderAnnounce(app) {
  app.innerHTML = `
    <div class="chat-header">
      <div class="chat-back" onclick="backToMain()">‹</div>
      <div class="chat-header-info"><div class="chat-header-name">Announcement</div></div>
    </div>
    <div class="form">
      <div class="form-group"><div class="form-label">Text</div><textarea class="announce-area" id="annText" placeholder="New arrivals, updates..."></textarea></div>
      <button class="form-submit" onclick="submitAnnounce()">Publish</button>
      <button class="form-cancel" onclick="backToMain()">Cancel</button>
    </div>`;
}

function switchView(v) { view = v; render(); }
function backToMain() { view='leads'; currentLeadId=null; editingOffer=null; loadLeads(); render(); }
async function openLead(id) { currentLeadId=id; view='chat'; render(); }

async function loadMessages() {
  const c = document.getElementById('chatMsgs');
  if (!c) return;
  c.innerHTML = '<div class="empty"><p>Loading...</p></div>';
  try {
    const d = await api(`/admin/leads/${currentLeadId}`);
    const msgs = d.messages || [];
    if (!msgs.length) { c.innerHTML = '<div class="empty"><div class="icon">💬</div><p>No messages</p></div>'; return; }
    const fileMsgs = msgs.filter(m => m.file_id && (m.msg_type==='photo'||m.msg_type==='voice'||m.msg_type==='audio'||m.msg_type==='document'));
    await Promise.all(fileMsgs.map(async m => {
      try { const r = await api(`/admin/file/${encodeURIComponent(m.file_id)}`); if(m.msg_type==='photo') m._img=r.url; else if(m.msg_type==='document') m._img=r.url; else m._aud=r.url; } catch(e){}
    }));
    c.innerHTML = msgs.map(m => {
      const cl = m.direction==='client_to_admin'?'client':'admin';
      const t = m.sent_at ? new Date(m.sent_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '';
      let content = esc(m.text);
      if (m.file_id && m.msg_type === 'photo' && m._img) content = `<img src="${m._img}" style="width:100%;border-radius:12px;margin-bottom:6px" onerror="this.style.display='none'">${content}`;
      else if (m.file_id && (m.msg_type==='voice'||m.msg_type==='audio') && m._aud) { const dur=m.duration?` (${Math.floor(m.duration/60)}:${String(m.duration%60).padStart(2,'0')})`:''; content=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">🎤<audio controls style="height:32px;max-width:200px" src="${m._aud}"></audio>${dur}</div>${content}`; }
      else if (m.file_id && m.msg_type === 'document' && m._img) content = `<a href="${m._img}" target="_blank" style="display:flex;align-items:center;gap:8px;color:var(--yellow);text-decoration:none;font-size:13px;padding:8px 12px;background:rgba(255,212,0,0.1);border-radius:10px">📎 ${content}</a>`;
      else if (m.msg_type && m.msg_type!=='text') { const icons={photo:'📷',sticker:'🎨',document:'📎',voice:'🎤',video:'🎬',audio:'🎵',contact:'👤',location:'📍',animation:'🎞️'}; content=`${icons[m.msg_type]||'💬'} ${content}`; }
      return `<div class="msg ${cl}">${cl==='admin'?'<div class="sender">ReadyCo</div>':''}${content}<div class="time">${t}</div></div>`;
    }).join('');
    c.scrollTop = c.scrollHeight;
  } catch(e) { c.innerHTML = `<div class="empty"><p>${e.message}</p></div>`; }
}

async function sendReply() {
  const input = document.getElementById('replyInput'); const btn = document.getElementById('sendBtn');
  const text = input.value.trim(); if (!text || !currentLeadId) return;
  input.value=''; input.style.height='auto'; btn.classList.add('sending');
  try { await api('/admin/reply',{method:'POST',body:JSON.stringify({lead_id:currentLeadId,text})}); btn.classList.remove('sending'); await loadMessages(); loadLeads(); }
  catch(e) { btn.classList.remove('sending'); alert('Failed: '+e.message); }
}
async function sendFile(input) {
  const file = input.files[0]; if (!file || !currentLeadId) return; input.value='';
  const btn = document.getElementById('sendBtn'); btn.classList.add('sending');
  try { const fd = new FormData(); fd.append('file',file); fd.append('lead_id',currentLeadId);
    const h={}; h['X-Telegram-Init-Data']=tgUser?tgUser.id.toString():'8339164180';
    const r = await fetch(API+'/admin/sendfile',{method:'POST',headers:h,body:fd});
    if(!r.ok) throw new Error(await r.text()); btn.classList.remove('sending'); await loadMessages(); loadLeads();
  } catch(e) { btn.classList.remove('sending'); alert('Failed: '+e.message); }
}

async function submitOffer() {
  const data={}; FIELDS.forEach(f=>{const el=document.getElementById('f_'+f.key); if(el&&el.value.trim())data[f.key]=el.value.trim()});
  if(!data.jurisdiction||!data.price){alert('Jurisdiction and price required');return}
  try{await api('/admin/offers',{method:'POST',body:JSON.stringify(data)});alert('Published!');backToMain();loadOffers()}catch(e){alert(e.message)}
}
function editOffer(ref){const o=offers.find(x=>x.ref===ref);if(o){editingOffer=o;view='edit';render()}}
async function submitEdit(){
  const data={};FIELDS.forEach(f=>{const el=document.getElementById('f_'+f.key);if(el&&el.value.trim())data[f.key]=el.value.trim()});
  try{await api(`/admin/offers/${editingOffer.ref}`,{method:'PUT',body:JSON.stringify(data)});alert('Updated!');view='offers';loadOffers();render()}catch(e){alert(e.message)}
}
function markSold(ref){showConfirm(`Mark ${ref} as SOLD?`,'Channel post will be edited.',async()=>{try{await api(`/admin/offers/${ref}/sold`,{method:'POST'});alert('Sold!');loadOffers()}catch(e){alert(e.message)}})}
function deleteOffer(ref){showConfirm(`Delete ${ref}?`,'Permanent removal.',async()=>{try{await api(`/admin/offers/${ref}`,{method:'DELETE'});alert('Deleted!');loadOffers()}catch(e){alert(e.message)}})}
async function submitAnnounce(){const t=document.getElementById('annText').value.trim();if(!t)return;try{await api('/admin/announce',{method:'POST',body:JSON.stringify({text:t})});alert('Published!');backToMain()}catch(e){alert(e.message)}}

function showConfirm(title,body,onConfirm){const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal"><h3>${title}</h3><p>${body}</p><div class="modal-btns" style="flex-direction:row"><button class="modal-btn cancel" onclick="this.closest('.modal-bg').remove()">Cancel</button><button class="modal-btn confirm" id="cfBtn">Confirm</button></div></div>`;document.body.appendChild(m);m.querySelector('#cfBtn').onclick=()=>{m.remove();onConfirm()}}
function showLeadActions(leadId,username,userId){
  const link=username?`https://t.me/${username}`:`tg://user?id=${userId}`;
  const m=document.createElement('div');m.className='modal-bg';
  m.innerHTML=`<div class="modal"><h3>Lead actions</h3><p>Manage this lead</p><div class="modal-btns">
    <a href="${link}" target="_blank" class="modal-btn confirm" style="text-decoration:none">👤 Open profile</a>
    <div style="display:flex;gap:6px"><button class="modal-btn" style="background:var(--orange);color:var(--navy)" onclick="setTag(${leadId},'hot')">🔥 Hot</button><button class="modal-btn" style="background:var(--purple);color:#fff" onclick="setTag(${leadId},'warm')">Warm</button></div>
    <div style="display:flex;gap:6px"><button class="modal-btn" style="background:var(--text-3);color:var(--navy)" onclick="setTag(${leadId},'cold')">❄️ Cold</button><button class="modal-btn" style="background:var(--green);color:var(--navy)" onclick="setTag(${leadId},'closed')">✅ Closed</button></div>
    <button class="modal-btn" style="background:var(--navy-3);color:var(--text-2)" onclick="setTag(${leadId},null)">Remove tag</button>
    <button class="modal-btn danger" onclick="this.closest('.modal-bg').remove();blockLead(${leadId})">🚫 Block</button>
    <button class="modal-btn danger" onclick="this.closest('.modal-bg').remove();deleteLead(${leadId})">🗑 Delete chat</button>
    <button class="modal-btn cancel" onclick="this.closest('.modal-bg').remove()">Cancel</button>
  </div></div>`;document.body.appendChild(m);
}
async function setTag(leadId,tag){document.querySelectorAll('.modal-bg').forEach(m=>m.remove());try{await api(`/admin/leads/${leadId}/tag`,{method:'POST',body:JSON.stringify({tag})});loadLeads()}catch(e){alert(e.message)}}
let searchTimer=null;function searchLeads(q){clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{try{const d=await api(`/admin/leads${q?('?search='+encodeURIComponent(q)):''}`);leads=d.leads;if(view==='leads')render()}catch(e){}},300)}
async function blockLead(leadId){showConfirm('Block client?','They cannot message the bot.',async()=>{try{await api(`/admin/leads/${leadId}/block`,{method:'POST'});alert('Blocked');backToMain()}catch(e){alert(e.message)}})}
async function deleteLead(leadId){showConfirm('Delete chat?','All messages removed.',async()=>{try{await api(`/admin/leads/${leadId}`,{method:'DELETE'});alert('Deleted');backToMain()}catch(e){alert(e.message)}})}
function exportLeads(){const h={};h['X-Telegram-Init-Data']=tgUser?tgUser.id.toString():'8339164180';fetch(API+'/admin/leads/export',{headers:h}).then(r=>r.blob()).then(b=>{const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='leads.csv';a.click();URL.revokeObjectURL(u)}).catch(e=>alert('Export failed'))}
function doBackup(){const h={};h['X-Telegram-Init-Data']=tgUser?tgUser.id.toString():'8339164180';fetch(API+'/admin/backup',{headers:h}).then(r=>{alert('Backup sent to Telegram!');return r.blob()}).then(b=>{const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='readyco_backup.json';a.click();URL.revokeObjectURL(u)}).catch(e=>alert('Backup failed: '+e.message))}
async function doRestore(input){const file=input.files[0];if(!file)return;input.value='';if(!confirm('Restore will replace all current data. Continue?'))return;try{const fd=new FormData();fd.append('file',file);const h={};h['X-Telegram-Init-Data']=tgUser?tgUser.id.toString():'8339164180';const r=await fetch(API+'/admin/restore',{method:'POST',headers:h,body:fd});if(!r.ok)throw new Error(await r.text());const d=await r.json();alert('Restored: '+d.restored.offers+' offers, '+d.restored.leads+' leads');loadLeads();loadOffers()}catch(e){alert('Restore failed: '+e.message)}}

document.addEventListener('input',e=>{if(e.target.id==='replyInput'){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,80)+'px'}});
document.addEventListener('keydown',e=>{if(e.target.id==='replyInput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendReply()}});
async function loadLeads() { try { const d = await api('/admin/leads'); leads = d.leads; if (view==='leads') render(); } catch(e){} }
async function loadOffers() { try { const d = await api('/admin/offers'); offers = d.offers; if (view==='offers') render(); } catch(e){} }

// Parallel load on startup
async function initLoad() {
  await Promise.all([loadLeads(), loadOffers()]);
  render();
}
initLoad();
</script>
</body>
</html>
